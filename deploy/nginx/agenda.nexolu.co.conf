# nexolu-spa-front (SPA de Vue, build estatico) servido directo por el nginx
# del droplet legacy `nexolu` -- el mismo que sirve pos.nexolu.co.
#
# El build NO se hace en este servidor: tiene un solo core y compilar aca
# degrada las requests en vivo del monolito. deploy.sh compila en la maquina
# del desarrollador y sube el resultado.
#
# `root` apunta a `current`, un symlink que deploy.sh cambia de golpe con un
# rename atomico al terminar la subida. nginx resuelve el root en cada
# request, asi que el cambio de version es instantaneo y nadie ve un estado
# intermedio: ni ventana de mantenimiento ni reload de nginx.

server {
    listen 80;
    server_name agenda.nexolu.co;

    root /opt/nexolu/nexolu-spa-front/current;
    index index.html;

    # index.html nunca se cachea: es lo unico que referencia los nombres
    # hasheados de los assets. Si un cliente lo cachea, sigue pidiendo
    # archivos de una release que ya se borro.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # Los assets llevan hash en el nombre: inmutables, cacheables a un ano.
    #
    # El fallback a la release anterior cubre la ventana real de un deploy:
    # una pestana que ya estaba abierta conserva el index.html viejo en
    # memoria y va a pedir assets que en `current` ya no existen. Sin este
    # fallback esa pestana se rompe con un 404 de chunk hasta que el usuario
    # recargue.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @release_anterior;
    }

    location @release_anterior {
        root /opt/nexolu/nexolu-spa-front/previous;
        try_files $uri =404;
    }

    # Fallback a index.html porque las rutas son de cliente (Vue Router):
    # sin esto, refrescar en /agenda o /reservar/<negocio> da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
